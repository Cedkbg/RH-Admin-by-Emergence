    <script>
      // Prevent FOUC (Flash of Unstyled Content) for dark mode
      (function() {
        const theme = localStorage.getItem('theme') || 'light';
        if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
